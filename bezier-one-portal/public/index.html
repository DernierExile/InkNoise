<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bézier ONE — Creative Library</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    .landing { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 28px clamp(20px, 5vw, 64px); }
    .landing header { display: flex; justify-content: space-between; align-items: center; }
    .landing header .brand { font-size: 20px; }
    .landing main { display: grid; place-items: center; text-align: center; }
    .landing h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 7vw, 88px); letter-spacing: -0.02em; line-height: 1; margin: 0 0 22px; }
    .landing h1 em { font-style: italic; color: var(--accent-2); }
    .landing p { color: var(--muted); font-size: 16px; max-width: 520px; margin: 0 auto 34px; }
    .landing footer { color: var(--muted-2); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .landing footer a:hover { color: var(--text); }
  </style>
</head>
<body class="page">
  <div class="landing">
    <header>
      <span class="brand"><em>Bézier</em><strong>ONE</strong></span>
      <a class="btn ghost sm" href="/admin">Espace studio</a>
    </header>
    <main>
      <div>
        <h1>De belles idées.<br><em>Au même endroit.</em></h1>
        <p>Creative Library. Les sélections partagées avec vous sont accessibles uniquement par le lien privé que vous avez reçu.</p>
      </div>
    </main>
    <footer>
      <span>Bézier ONE · Creative Library</span>
      <a href="/admin">Accès studio</a>
    </footer>
  </div>
</body>
</html>
