# Équivalent manuel de ce que génère deploy/install.sh (projet Docker « bezier-portal-v2 »).
# La v1 (projet « bezier-portal » : portal, caddy, cloudflared) n'est pas modifiée :
#   - la v2 rejoint le réseau Docker de la v1 sous l'alias « portal », que le tunnel
#     Cloudflare utilise déjà (route http://portal:8080) ;
#   - il faut arrêter le conteneur `portal` v1 avant de démarrer la v2 (même port 8095) ;
#   - le jeton Cloudflare reste dans le Compose de la v1, jamais dans ce dépôt.
# Le fichier .env à côté contient ADMIN_PASSWORD=... (voir .env.example).

services:
  portal:
    build:
      context: /home/thierrybezier/BezierPortal-v2
      network: host
    image: bezier-one-portal:2
    container_name: bezier-portal-v2
    restart: unless-stopped
    ports:
      - "8095:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      LIBRARY_ROOT: /library
      DATA_DIR: /data/v2
      PUBLIC_ORIGIN: https://clients.thierrybezier.com
      SCAN_INTERVAL_MIN: "15"
      THUMB_CONCURRENCY: "2"
      PREWARM_THUMBS: "1"
    volumes:
      - /home/thierrybezier/Playbook:/library:ro
      - portal-data:/data
    networks:
      default:
        aliases:
          - portal
    stop_grace_period: 15s

networks:
  default:
    # Réseau du projet v1 (celui du conteneur cloudflared) ; `docker network ls` pour vérifier.
    name: bezier-portal_default
    external: true

volumes:
  portal-data:
